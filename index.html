<!doctype html>

  <title>SICU · Room 04</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dce6e7;color:#243638;font-family:Manrope,Arial,sans-serif}
    #scene{position:fixed;inset:0} canvas{display:block;width:100%;height:100%}
    .topbar{position:fixed;top:0;left:0;right:0;height:82px;padding:0 36px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(245,248,246,.93),rgba(245,248,246,.72));border-bottom:1px solid rgba(43,67,66,.12);backdrop-filter:blur(16px);z-index:2}
    .brand{display:flex;align-items:center;gap:13px}.mark{width:32px;height:32px;border-radius:9px;background:#315f59;color:#ecf4ee;display:grid;place-items:center;font-size:20px;font-weight:500;box-shadow:0 4px 12px #315f5930}.brand small,.eyebrow{font:500 10px 'DM Mono',monospace;letter-spacing:.15em;color:#748482;text-transform:uppercase}.brand strong{display:block;font-size:14px;letter-spacing:.01em;margin-top:3px}.meta{display:flex;align-items:center;gap:24px}.room{font:500 11px 'DM Mono',monospace;letter-spacing:.08em;color:#4a605e}.live{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid #cad8d2;border-radius:30px;font:500 10px 'DM Mono',monospace;letter-spacing:.08em;color:#46645b;background:#f7faf6}.dot{width:6px;height:6px;border-radius:100%;background:#7caa8c;box-shadow:0 0 0 3px #7caa8c22}
    .caption{position:fixed;left:36px;bottom:32px;z-index:2;pointer-events:none}.caption .eyebrow{color:#627673}.caption h1{font-size:25px;line-height:1.1;margin:8px 0 0;letter-spacing:-.04em;font-weight:700;color:#263c3b}.caption p{font-size:12px;color:#627371;margin:8px 0 0}.hint{position:fixed;right:32px;bottom:32px;z-index:2;display:flex;gap:12px;align-items:center;padding:10px 13px;border:1px solid #c8d3d0;background:#edf2efcc;border-radius:8px;color:#61716e;font:10px 'DM Mono',monospace;letter-spacing:.04em;backdrop-filter:blur(8px)}.hint span{display:flex;align-items:center;gap:6px}.hint b{display:grid;place-items:center;width:17px;height:17px;border:1px solid #b9c7c2;border-radius:4px;font-size:9px;font-weight:400;color:#49605b}
    @media(max-width:700px){.topbar{height:68px;padding:0 18px}.meta{gap:9px}.room{display:none}.caption{left:18px;bottom:23px}.caption h1{font-size:20px}.caption p{max-width:230px;line-height:1.5}.hint{right:14px;bottom:20px;gap:7px;padding:8px}.hint span{font-size:0}.hint b{font-size:9px}.brand strong{font-size:12px}}

<body>
  <div id="scene"></div>
  <header class="topbar">
    <div class="brand"><div class="mark">✳</div><div><small>North · Surgical Intensive Care</small><strong>Clinical environment</strong></div></div>
    <div class="meta"><span class="room">UNIT 04 &nbsp; / &nbsp; SICU</span><span class="live"><i class="dot"></i> STATIC SCENE</span></div>
  </header>
  <div class="caption"><div class="eyebrow">Room 04 · Critical care</div><h1>Surgical ICU</h1><p>Equipment layout · Orientation view</p></div>
  <div class="hint"><span><b>↔</b> ORBIT</span><span><b>⌕</b> ZOOM</span><span><b>⇧</b> PAN</span></div>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    const host=document.querySelector('#scene');
    const scene=new THREE.Scene(); scene.background=new THREE.Color('#dce6e7'); scene.fog=new THREE.Fog('#dce6e7',19,34);
    const camera=new THREE.PerspectiveCamera(37,innerWidth/innerHeight,.1,100); camera.position.set(9.4,8.4,11.8);
    const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=.88; host.appendChild(renderer.domElement);
    const controls=new OrbitControls(camera,renderer.domElement); controls.target.set(0,1.5,0); controls.enableDamping=true; controls.dampingFactor=.07; controls.minDistance=7.4; controls.maxDistance=21; controls.maxPolarAngle=Math.PI*.49; controls.minPolarAngle=.2; controls.update();
    scene.add(new THREE.HemisphereLight('#f3fbff','#93a49e',1.45)); const key=new THREE.DirectionalLight('#fff4df',2.05); key.position.set(-4,11,5); key.castShadow=true; key.shadow.mapSize.set(2048,2048); key.shadow.camera.left=-9;key.shadow.camera.right=9;key.shadow.camera.top=10;key.shadow.camera.bottom=-7;scene.add(key);
    const fill=new THREE.DirectionalLight('#c8e3ee',.72); fill.position.set(7,6,-4);scene.add(fill);
    const mats={floor:new THREE.MeshStandardMaterial({color:'#c9d3d0',roughness:.82}),wall:new THREE.MeshStandardMaterial({color:'#e9eeea',roughness:.92}),green:new THREE.MeshStandardMaterial({color:'#b9cec2',roughness:.85}),steel:new THREE.MeshStandardMaterial({color:'#8a9c9d',metalness:.68,roughness:.3}),white:new THREE.MeshStandardMaterial({color:'#f3f5f1',roughness:.47}),dark:new THREE.MeshStandardMaterial({color:'#26383c',roughness:.42}),blue:new THREE.MeshStandardMaterial({color:'#628c92',roughness:.58}),teal:new THREE.MeshStandardMaterial({color:'#477c75',roughness:.65}),linen:new THREE.MeshStandardMaterial({color:'#e5e9e1',roughness:1}),skin:new THREE.MeshStandardMaterial({color:'#c9a58f',roughness:.9}),gown:new THREE.MeshStandardMaterial({color:'#9ab7b2',roughness:.95}),rubber:new THREE.MeshStandardMaterial({color:'#b7c6c1',roughness:.4}),screen:new THREE.MeshStandardMaterial({color:'#101f27',emissive:'#071217',roughness:.25})};
    const sceneObjects={};
    function box(parent,name,pos,size,mat,opts={}){const m=new THREE.Mesh(new THREE.BoxGeometry(...size),mat);m.position.set(...pos);m.castShadow=opts.cast!==false;m.receiveShadow=true;if(opts.rot)m.rotation.set(...opts.rot);m.name=name;if(parent)parent.add(m);return m}
    function cyl(parent,name,pos,r1,r2,h,mat,segments=24){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,segments),mat);m.position.set(...pos);m.castShadow=true;m.receiveShadow=true;m.name=name;parent.add(m);return m}
    function sphere(parent,name,pos,scale,mat){const m=new THREE.Mesh(new THREE.SphereGeometry(1,28,20),mat);m.position.set(...pos);m.scale.set(...scale);m.castShadow=true;m.receiveShadow=true;m.name=name;parent.add(m);return m}
    function rod(parent,name,a,b,r,mat){const va=new THREE.Vector3(...a),vb=new THREE.Vector3(...b),d=vb.clone().sub(va);const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),14),mat);m.position.copy(va.add(vb).multiplyScalar(.5));m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());m.castShadow=true;parent.add(m);m.name=name;return m}
    function label(text,pos){const c=document.createElement('canvas'),ctx=c.getContext('2d');ctx.font='600 26px Manrope,Arial';const w=Math.ceil(ctx.measureText(text).width)+36;c.width=w;c.height=54;ctx.font='600 26px Manrope,Arial';ctx.fillStyle='rgba(244,248,244,.96)';roundRect(ctx,1,1,w-2,52,10);ctx.fill();ctx.strokeStyle='rgba(80,112,102,.32)';ctx.lineWidth=2;roundRect(ctx,1,1,w-2,52,10);ctx.stroke();ctx.fillStyle='#38564f';ctx.fillText(text,18,36);const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));sp.position.set(...pos);sp.scale.set(w/160,54/160,1);scene.add(sp);return sp}
    function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
    // Room shell and cleanable flooring.
    box(scene,'floor',[0,-.16,0],[14,.3,11],mats.floor); box(scene,'back wall',[0,3.05,-5.45],[14,6.4,.25],mats.wall);box(scene,'left wall',[-7,3.05,0],[.25,6.4,11],mats.wall);
    box(scene,'wall protection',[0,1.2,-5.28],[13.7,.28,.08],mats.green,{cast:false});
    for(let i=-6;i<7;i+=1)box(scene,'floor seam',[i,-.004,0],[.012,.008,10.7],new THREE.MeshStandardMaterial({color:'#b9c6c2',roughness:1}),{cast:false});
    // Recessed ceiling exam light and soft luminous panel.
    box(scene,'overhead exam light',[-.2,5.8,.15],[3.1,.13,1.3],mats.white);const glow=new THREE.Mesh(new THREE.BoxGeometry(2.7,.025,1.02),new THREE.MeshBasicMaterial({color:'#fff8df'}));glow.position.set(-.2,5.72,.15);scene.add(glow);const exam=new THREE.SpotLight('#fff4dd',55,12,Math.PI/3,.5,1.4);exam.position.set(-.2,5.6,.1);exam.target.position.set(0,0,0);scene.add(exam,exam.target);
    // Bed chassis and elevated articulated deck: head end at positive Z.
    const bed=new THREE.Group();bed.name='bed';bed.position.set(0,0,.25);scene.add(bed);sceneObjects.bed=bed;
    box(bed,'bed base',[0,.76,0],[2.22,.22,4.6],mats.steel);box(bed,'bed frame',[0,1.02,0],[2.35,.17,4.75],mats.white);
    for(const x of [-.83,.83])for(const z of [-1.7,1.7]){cyl(bed,'caster socket',[x,.57,z],.11,.11,.25,mats.steel);const wheel=cyl(bed,'bed caster',[x,.38,z],.13,.13,.14,mats.dark);wheel.rotation.x=Math.PI/2}
    // Mattress and split raised head section, pitched ~30 degrees.
    box(bed,'lower mattress',[0,1.26,-.48],[2.05,.32,2.55],mats.linen);
    const raised=new THREE.Group();raised.position.set(0,1.31,.79);raised.rotation.x=-Math.PI/6;bed.add(raised);box(raised,'raised head mattress',[0,0,.82],[2.05,.3,1.9],mats.linen);
    box(bed,'footboard',[0,1.6,-2.43],[2.45,.95,.12],mats.white);box(bed,'footboard inset',[0,1.65,-2.355],[1.15,.36,.025],mats.green,{cast:false});
    for(const x of [-1.18,1.18]){box(bed,'side rail',[x,1.65,-.3],[.11,.12,2.7],mats.steel);box(bed,'raised side rail',[x,1.94,.83],[.11,.12,1.48],mats.steel,{rot:[-Math.PI/6,0,0]});}
    // Neutral adult male mannequin, clothed, no lines attached.
    const patient=new THREE.Group();patient.name='patient';patient.position.set(0,1.9,.4);bed.add(patient);sceneObjects.patient=patient;
    sphere(patient,'head',[0,.28,1.72],[.37,.42,.42],mats.skin);sphere(patient,'hair',[0,.53,1.76],[.35,.19,.37],new THREE.MeshStandardMaterial({color:'#555a57',roughness:1}));
    const torso=sphere(patient,'gowned torso',[0,.02,.49],[.67,.42,1.12],mats.gown);torso.rotation.x=-.15;
    sphere(patient,'gown hem',[0,-.03,-.73],[.72,.38,.69],mats.gown);
    for(const side of [-1,1]){const arm=sphere(patient,'sleeve',[side*.67,-.12,.57],[.22,.26,.75],mats.gown);arm.rotation.z=side*.15;const hand=sphere(patient,'hand',[side*.71,-.19,-.03],[.17,.12,.22],mats.skin);}
    // bedside table
    const table=new THREE.Group();table.position.set(-2.35,0,1.6);table.name='bedsideTable';scene.add(table);box(table,'table pedestal',[0,.64,0],[.78,1.25,.72],mats.white);box(table,'table top',[0,1.3,0],[.91,.13,.82],mats.white);box(table,'drawer',[0,1.02,.37],[.62,.26,.025],mats.green);box(table,'drawer pull',[0,1.02,.4],[.23,.035,.025],mats.steel);
    // Equipment carts with legible, floating nameplates.
    function cart(x,z,w=1.05,d=.72){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);for(const xx of [-w*.38,w*.38])for(const zz of [-d*.36,d*.36]){cyl(g,'cart caster',[xx,.12,zz],.08,.08,.12,mats.dark)}box(g,'cart base',[0,.3,0],[w,.12,d],mats.white);for(const xx of [-w*.42,w*.42])rod(g,'cart upright',[xx,.35,-d*.34],[xx,1.85,-d*.34],.035,mats.steel);box(g,'equipment shelf',[0,.6,0],[w*.86,.08,d*.76],mats.white);return g}
    function monitor(x,z){const g=cart(x,z,1.22,.8);g.name='monitor';box(g,'monitor housing',[0,2.3,-.08],[1.1,.78,.18],mats.dark);box(g,'monitor display',[0,2.31,.02],[.96,.61,.025],mats.screen,{cast:false});
      // Static ECG trace and numeric placeholder values.
      const cv=document.createElement('canvas');cv.width=700;cv.height=420;const c=cv.getContext('2d');c.fillStyle='#10242a';c.fillRect(0,0,700,420);c.strokeStyle='#35524f';c.lineWidth=1;for(let y=48;y<420;y+=52){c.beginPath();c.moveTo(0,y);c.lineTo(700,y);c.stroke()}c.fillStyle='#91c8aa';c.font='500 76px DM Mono,monospace';c.fillText('78',35,114);c.fillStyle='#92a8a4';c.font='26px DM Mono,monospace';c.fillText('HR bpm',37,153);c.fillStyle='#a7c8b4';c.font='54px DM Mono,monospace';c.fillText('122/76',295,108);c.fillStyle='#92a8a4';c.font='22px DM Mono,monospace';c.fillText('NIBP mmHg',300,143);c.fillStyle='#75c5b2';c.font='54px DM Mono,monospace';c.fillText('97',526,223);c.fillStyle='#92a8a4';c.font='22px DM Mono,monospace';c.fillText('SpO₂ %',532,254);c.strokeStyle='#69d1ae';c.lineWidth=4;c.beginPath();c.moveTo(24,303);for(let i=0;i<30;i++){let xx=24+i*22,yy=310+(i%8===3?-55:i%8===4?22:i%8===5?-8:0);c.lineTo(xx,yy)}c.stroke();const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;const face=new THREE.Mesh(new THREE.PlaneGeometry(.91,.55),new THREE.MeshBasicMaterial({map:tex}));face.position.set(0,2.31,.039);g.add(face);box(g,'monitor control panel',[0,1.82,.04],[.94,.14,.1],mats.dark);label('PATIENT MONITOR',[x,3.04,z]);sceneObjects.monitor=g;return g}
    function ventilator(x,z){const g=cart(x,z,1.0,.78);g.name='ventilator';box(g,'ventilator body',[0,1.55,0],[.86,1.3,.65],mats.white);box(g,'ventilator control panel',[0,2.4,.37],[.78,.56,.09],mats.dark);box(g,'ventilator screen',[0,2.42,.425],[.63,.37,.02],mats.screen,{cast:false});box(g,'vent display highlight',[0,2.42,.439],[.50,.02,.01],mats.teal,{cast:false});cyl(g,'flow control',[.31,2.06,.39],.06,.06,.04,mats.steel).rotation.x=Math.PI/2;
      // visible corrugated tubing, looped beside the trolley and disconnected
      const pts=[];for(let i=0;i<=100;i++){const t=i/100*Math.PI*2;pts.push(new THREE.Vector3(.6+.28*Math.cos(t),1.08+.17*Math.sin(2*t),.45+.35*Math.sin(t)))}const tube=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),180,.045,10,false),mats.rubber);tube.castShadow=true;g.add(tube);rod(g,'loose ventilator limb',[.6,1.08,.45],[.82,1.2,.55],.045,mats.rubber);label('VENTILATOR',[x,3.02,z]);sceneObjects.ventilator=g;return g}
    function pump(x,z,n){const g=new THREE.Group();g.position.set(x,0,z);g.name='ivPump'+n;scene.add(g);rod(g,'IV pole',[0,.16,0],[0,2.75,0],.035,mats.steel);for(const a of [0,2.1,4.2])rod(g,'IV pole foot',[0,.18,0],[.4*Math.cos(a),.1,.4*Math.sin(a)],.025,mats.steel);cyl(g,'IV pole collar',[0,2.7,0],.07,.07,.12,mats.steel);
      box(g,'infusion pump',[0,2.12,.13],[.46,.49,.28],mats.white);box(g,'pump display',[0,2.19,.28],[.32,.17,.02],mats.screen,{cast:false});box(g,'pump controls',[0,1.96,.28],[.32,.06,.02],mats.blue,{cast:false});
      // Bag and short free-hanging line terminate well above the patient.
      cyl(g,'fluid bag',[0,2.84,0],.20,.17,.38,new THREE.MeshStandardMaterial({color:'#dce8df',transparent:true,opacity:.8,roughness:.2}));rod(g,'bag hook',[0,2.74,0],[0,2.69,0],.025,mats.steel);rod(g,'disconnected IV line',[.04,1.88,.2],[.12,1.15,.2],.012,mats.rubber);label('IV PUMP '+n,[x,3.47,z]);sceneObjects['ivPump'+n]=g;return g}
    function medsCart(x,z){const g=new THREE.Group();g.name='crashCart';g.position.set(x,0,z);scene.add(g);box(g,'crash cart body',[0,.9,0],[1.13,1.65,.82],mats.white);box(g,'crash cart top',[0,1.78,0],[1.22,.1,.9],mats.teal);for(let y of [1.5,1.22,.94,.66]){box(g,'drawer',[0,y,.42],[.91,.21,.035],mats.green);box(g,'drawer handle',[0,y,.45],[.26,.035,.025],mats.steel)}box(g,'defib module',[0,2.02,0],[.83,.34,.55],mats.dark);box(g,'defib display',[0,2.04,.29],[.43,.18,.02],mats.screen);for(const xx of [-.42,.42])for(const zz of [-.28,.28])cyl(g,'cart wheel',[xx,.13,zz],.09,.09,.14,mats.dark);label('CRASH CART',[x,2.65,z]);sceneObjects.crashCart=g;return g}
    // Functional room arrangement.
    monitor(3.4,2.05);ventilator(3.45,-.55);pump(-3.45,1.25,1);pump(-4.65,-.05,2);pump(-3.45,-1.5,3);medsCart(4.65,-2.75);
    // Wall service points, sharps, gloves and suction canister.
    box(scene,'wall oxygen outlet',[1.95,2.25,-5.22],[.43,.48,.12],mats.white);cyl(scene,'oxygen flowmeter',[1.95,2.0,-5.08],.075,.075,.28,mats.steel);box(scene,'oxygen label',[1.95,2.55,-5.08],[.36,.09,.025],mats.green,{cast:false});
    box(scene,'glove dispenser',[-4.45,2.28,-5.18],[.72,.65,.35],mats.white);box(scene,'glove dispenser window',[-4.45,2.3,-4.99],[.45,.32,.025],mats.green,{cast:false});box(scene,'glove pull',[-4.45,2.06,-4.96],[.24,.11,.02],mats.white);
    box(scene,'sharps container',[-5.65,1.75,-5.07],[.52,.58,.38],new THREE.MeshStandardMaterial({color:'#dfbd65',roughness:.65}));box(scene,'sharps lid',[-5.65,2.06,-5.07],[.55,.08,.4],mats.white);
    const suction=new THREE.Group();suction.name='suction';suction.position.set(1.2,0,-4.7);scene.add(suction);cyl(suction,'suction canister',[0,1.62,0],.24,.21,.66,new THREE.MeshStandardMaterial({color:'#d8e7db',transparent:true,opacity:.76,roughness:.22}));cyl(suction,'suction lid',[0,1.97,0],.25,.25,.08,mats.blue);cyl(suction,'suction wall bracket',[0,1.55,-.2],.08,.08,.52,mats.steel);label('SUCTION',[1.2,2.3,-4.55]);sceneObjects.suction=suction;
    // IV lines rest against their pole only, and the ventilator remains separate from the patient.
    // Small wall rail and outlet accents.
    box(scene,'wall equipment rail',[0,2.05,-5.22],[5.8,.07,.11],mats.steel);for(let x of [-1.2,0,1.15])box(scene,'rail mount',[x,2.12,-5.2],[.13,.22,.08],mats.steel);
    // Camera frame is aimed toward the whole clinical arrangement.
    function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
    renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
    window.sceneObjects=sceneObjects;window.scene=scene;window.camera=camera;
